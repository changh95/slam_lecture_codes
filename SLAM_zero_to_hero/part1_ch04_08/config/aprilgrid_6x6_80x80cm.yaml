# Kalibr target: standard 6x6 Aprilgrid on A0 (80x80 cm).
# Measure a tag edge-to-edge if you print your own -- a wrong tagSize leaves
# intrinsics correct but scales all translations.
target_type: 'aprilgrid'
tagCols: 6
tagRows: 6
tagSize: 0.088     # apriltag edge to edge [m]
tagSpacing: 0.3    # ratio of space between tags to tagSize
