common:
    lid_topic:  "/hesai/pandar"
    imu_topic:  "/alphasense/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    # 1 Livox Avia, 2 Velodyne, 3 Ouster, 4 MARSIM (see src/preprocess.h LID_TYPE).
    # The Hesai PandarXT-32 goes through the VELODYNE branch: its cloud carries
    # x/y/z/intensity + ring but no per-point `time`, so velodyne_handler()
    # rebuilds intra-scan time from the azimuth. 4 would run the MARSIM
    # simulator handler on a real sensor. See ../../fast_lio2/README.md.
    lidar_type: 2
    scan_line: 32
    scan_rate: 10
    timestamp_unit: 3            # inert here: there is no float32 `time` field to scale
    blind: 2

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     100.0
    extrinsic_est_en:  false
    extrinsic_T: [ -0.001, -0.00855, 0.055]
    extrinsic_R: [ 0, -1, 0,
                  -1,  0, 0,
                   0,  0, -1]

publish:
    path_en:  false
    scan_publish_en:  true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
