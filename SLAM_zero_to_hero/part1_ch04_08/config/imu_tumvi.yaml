# Kalibr IMU config for the TUM VI sensor head.
# TUM's published values, inflated (white noise x2, bias random walk x10) as they
# recommend for cam-imu calibration. Raw Allan-plot values are 0.0014 / 0.000086
# / 0.000080 / 0.0000022 respectively.
rostopic: /imu0
update_rate: 200.0                       # Hz

accelerometer_noise_density: 0.0028      # m/s^1.5
accelerometer_random_walk:   0.00086     # m/s^2.5
gyroscope_noise_density:     0.00016     # rad/s^0.5
gyroscope_random_walk:       0.000022    # rad/s^1.5
